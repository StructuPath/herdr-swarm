name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        # macOS is a supported platform (herdr-plugin.toml) with a BSD
        # userland and an older /bin/bash — run the full suite there too.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Check out repository
        # v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Node.js
        # v4.0.3
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b
        with:
          node-version: 20
      - name: Run tests
        run: npm test
      - name: Validate shell syntax
        run: bash -n scripts/*.sh
      - name: Validate plugin manifest
        run: node scripts/check-manifest.mjs

  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        # v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Shellcheck all scripts
        # -x follows the lib.sh sourcing; default severity (style) is the bar.
        run: shellcheck -x scripts/*.sh
